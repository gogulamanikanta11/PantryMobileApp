name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint-and-format:
    name: Lint and Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: '20'

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  web-e2e:
    name: Run Web E2E Tests (Selenium)
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: '20'

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install web-tests dependencies
        run: |
          cd web-tests
          npm install --legacy-peer-deps

      - name: Start Expo Web Server
        env:
          CI: true
          EXPO_NO_BROWSER: 1
        run: |
          npx expo start --web --port 19006 > expo.log 2>&1 &
          echo $! > /tmp/expo.pid

      - name: Wait for Expo Web Server
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:19006 > /dev/null; then
              echo "Server is up!"
              exit 0
            fi
            echo "Waiting for web server to start on port 19006..."
            sleep 3
          done
          cat expo.log
          exit 1

      - name: Run Web E2E Tests
        run: |
          cd web-tests
          npm test

      - name: Generate Excel Report
        if: always()
        run: node scripts/generate_excel.js

      - name: Upload Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-test-report
          path: |
            docs/*.xlsx
            docs/*.png

  android-e2e:
    name: Run Android Appium E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps
          cd appium-tests
          npm install --legacy-peer-deps

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK Build Output
        run: |
          ls -al android/app/build/outputs/apk/debug
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-name: test-emulator
          force-avd-creation: true
          disable-animations: true

      - name: Run Appium Tests
        run: npm run test:android

  build-web:
    name: Validate and Build Web App
    runs-on: ubuntu-latest
    needs: [lint-and-format, web-e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: '20'

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: npx expo export --platform web --output-dir web-build

  deploy-web:
    name: Deploy Web Build to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: '20'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-build
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
